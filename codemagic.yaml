workflows:
  ios-workflow:
    name: Build iOS for TestFlight
    max_build_duration: 60
    environment:
      vars:
        APP_NAME: "AppBDS"
        BUNDLE_ID: "com.yourcompany.appbds"
      flutter: stable
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build iOS
        script: |
          npx react-native bundle --platform ios --entry-file index.js --bundle-output ios/main.jsbundle
          xcodebuild -workspace ios/AppBDS.xcworkspace -scheme AppBDS -configuration Release -sdk iphoneos -archivePath $CM_BUILD_DIR/AppBDS.xcarchive archive
          xcodebuild -exportArchive -archivePath $CM_BUILD_DIR/AppBDS.xcarchive -exportOptionsPlist ios/ExportOptions.plist -exportPath $CM_BUILD_DIR
    artifacts:
      - $CM_BUILD_DIR/*.ipa
